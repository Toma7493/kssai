<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>名の無いタコスとバーガー屋 POS & 管理システム</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/idb@8/build/umd.js"></script>
</head>
<body>
    <header class="app-header">
        <div class="logo">🍔🌮 名の無いタコスとバーガー屋</div>
        <div id="current-location-display" style="font-size: 0.9rem; color: #666; font-weight: bold;">メインキッチン</div>
    </header>

    <main class="app-main">
        <!-- 各画面のコンテナ -->
        <section id="dashboard" class="page-section">
            <!-- ダッシュボードの内容 -->
        </section>
        <section id="pos" class="page-section active">
            <!-- レジ画面の内容 -->
        </section>
        <section id="history" class="page-section">
            <!-- 売上履歴の内容 -->
        </section>
        <section id="expenses" class="page-section">
            <!-- 経費の内容 -->
        </section>
        <section id="products" class="page-section">
            <!-- 商品管理の内容 -->
        </section>
        <section id="analytics" class="page-section">
            <!-- 分析の内容 -->
        </section>
        <section id="funds" class="page-section">
            <!-- 資金・税金の内容 -->
        </section>
        <section id="settings" class="page-section">
            <!-- 設定の内容 -->
        </section>
        <section id="more" class="page-section">
            <h2 style="margin-bottom: 1.5rem;">その他メニュー</h2>
            <div class="grid grid-cols-1">
                <button onclick="showSection('products')" class="more-menu-btn">📦 商品管理</button>
                <button onclick="showSection('analytics')" class="more-menu-btn">📊 分析</button>
                <button onclick="showSection('funds')" class="more-menu-btn">💰 資金・税金</button>
                <button onclick="showSection('settings')" class="more-menu-btn">⚙️ 設定・バックアップ</button>
            </div>
        </section>
    </main>

    <nav class="bottom-nav">
        <button class="nav-btn" data-target="dashboard">
            <div style="font-size: 1.2rem;">🏠</div>ホーム
        </button>
        <button class="nav-btn active" data-target="pos">
            <div style="font-size: 1.2rem;">📝</div>売上
        </button>
        <button class="nav-btn" data-target="expenses">
            <div style="font-size: 1.2rem;">💸</div>経費
        </button>
        <button class="nav-btn" data-target="history">
            <div style="font-size: 1.2rem;">🕒</div>履歴
        </button>
        <button class="nav-btn" data-target="more">
            <div style="font-size: 1.2rem;">≡</div>その他
        </button>
    </nav>

    <script src="js/db.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/history.js"></script>
    <script src="js/expenses.js"></script>
    <script src="js/products.js"></script>
    <script src="js/analytics.js"></script>
    <script src="js/funds.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
